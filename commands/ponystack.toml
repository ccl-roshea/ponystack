description = "Show the ponystack membrane, or force a phase (understand/implement/review/neutral)"
prompt = "Apply ponystack: the membrane between an expensive brain and cheap hands. Boil the lake to understand; do not pour it into your code. Think expensive, write cheap. An argument ({{args}}) forces that phase for this turn - the router honours it above every other rule, including the wording of the rest of your message: understand = boil the lake, lazy senior silent; implement = lazy senior at MAX, climb the ladder (YAGNI, stdlib, native feature, installed dep, one line, minimum), shortest working diff, never cut validation/security/accessibility; review = both correctness bugs and a delete-list; neutral = no phase rule, the ladder governs code, not prose or ops. No argument: report the current phase model and stay routed automatically."
