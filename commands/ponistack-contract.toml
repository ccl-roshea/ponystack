description = "Contract gate (Seam 2): cut a wide pass to the minimum that works"
prompt = "Run the ponistack contract gate on the current diff (or the proposed plan). The lake was boiled; now close the membrane. Find everything that does not earn its lines and list one finding per line as `L<line>: <tag> <what>. <replacement>.` Tags: delete (dead/speculative, replace with nothing), stdlib (reinvented standard library, name the function), native (does what the platform already does, name the feature), yagni (one-implementation abstraction / config nobody sets / one-caller layer), shrink (same logic fewer lines, show it). End with `net: -<N> lines possible.` or `Lean already. Ship.` Complexity only. Never flag the one mandatory runnable check, and never cut trust-boundary validation, data-loss handling, security, or accessibility. List, do not apply, unless asked."
