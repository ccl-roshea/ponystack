description = "Show the ponistack membrane, or force a phase (understand/implement/review)"
prompt = "Apply ponistack: the membrane between an expensive brain and cheap hands. Boil the lake to understand; do not pour it into your code. Think expensive, write cheap. If an argument is given ({{args}}), force that phase for now: understand = boil the lake, lazy senior silent; implement = lazy senior at MAX, climb the ladder (YAGNI, stdlib, native feature, installed dep, one line, minimum), shortest working diff, never cut validation/security/accessibility; review = both correctness bugs and a delete-list. No argument: report the current phase model and stay routed automatically."
